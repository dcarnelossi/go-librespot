name: audio-export-ci

on:
  push:
    branches: [feature/ogg-track-export]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'feature/ogg-track-export' || github.ref }}
      - name: Apply audio export wiring
        if: github.event_name == 'push' && github.event.head_commit.message != 'feat: wire audio export into playback'
        run: |
          python3 .github/scripts/wire_audio_export.py
          gofmt -w player/audio_export.go player/player.go audio/chunked-reader.go audio/completed_reader.go daemon/app.go cmd/daemon/cli_config.go
      - name: Commit wiring
        if: github.event_name == 'push' && github.event.head_commit.message != 'feat: wire audio export into playback'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add player/audio_export.go player/player.go audio/chunked-reader.go audio/completed_reader.go daemon/app.go cmd/daemon/cli_config.go config_schema.json
          if ! git diff --cached --quiet; then
            git commit -m 'feat: wire audio export into playback'
            git push origin HEAD:feature/ogg-track-export
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libvorbis-dev libogg-dev libflac-dev libmpg123-dev
      - run: go test ./...
