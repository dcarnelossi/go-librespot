name: wire-audio-export

on:
  push:
    branches: [feature/ogg-track-export]

permissions:
  contents: write

jobs:
  wire:
    if: github.event.head_commit.message != 'feat: wire audio export into playback'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ogg-track-export
      - name: Apply wiring
        run: python3 .github/scripts/wire_audio_export.py
      - name: Format Go files
        run: gofmt -w player/audio_export.go player/player.go audio/chunked-reader.go audio/completed_reader.go daemon/app.go cmd/daemon/cli_config.go
      - name: Commit wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add player/audio_export.go player/player.go audio/chunked-reader.go audio/completed_reader.go daemon/app.go cmd/daemon/cli_config.go config_schema.json
          git diff --cached --exit-code && exit 0
          git commit -m 'feat: wire audio export into playback'
          git push origin HEAD:feature/ogg-track-export
