name: wire-audio-export

on:
  push:
    branches: [feature/ogg-track-export]

permissions:
  contents: write

jobs:
  wire:
    if: github.event.head_commit.message == 'chore: apply metadata wiring'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ogg-track-export
      - name: Apply metadata wiring
        run: python3 .github/scripts/wire_audio_export.py
      - name: Format Go files
        run: gofmt -w player/audio_export.go player/player.go
      - name: Commit wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add player/audio_export.go player/player.go
          git diff --cached --exit-code && exit 0
          git commit -m 'feat: add audio export metadata sidecar'
          git push origin HEAD:feature/ogg-track-export
